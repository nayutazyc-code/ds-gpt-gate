root: /home/box/workflows/ds-gpt-gate
tasks_dir: tasks
max_reviews: 3
gates: [planning, error, acceptance]
roles:
  executor:   {tool: dsh,   profile: web, preset: dafeiyu, name: 大肥鱼, writes: true}
  reviewer:   {tool: codex, agent: xiao-co,    name: 小co, sandbox: workspace-write, note: 写权限仅用于验收核对}
  architect:  {tool: codex, agent: architect,  sandbox: read-only, output_limit_chars: 200}
  explorer:   {tool: codex, agent: explorer,   sandbox: read-only}
  researcher: {tool: codex, agent: researcher, sandbox: read-only}
gate_reviewer: {planning: [architect, reviewer], error: [reviewer], acceptance: [reviewer, architect]}
paths:
  plan_candidates: [plan.md, PLAN.md, docs/plan.md]
  error_candidates: [error.log, logs/error*]
  packet: tasks/<id>/GATE_PACKET.md
  gate_records: tasks/<id>/gates/<ts>-<type>.md
limits: {diff_max_lines: 400, log_tail_lines: 120, plan_max_lines: 120}
auto_push_on_acceptance: true   # 验收门禁后自动 commit+push 到 workdir 的 origin；DS_GPT_GATE_AUTO_PUSH=0 可临时关闭
github:
  repo: "nayutazyc-code/ds-gpt-gate"   # 例如 git@github.com:<user>/<repo>.git（可空；需先在 workdir 设 origin）
